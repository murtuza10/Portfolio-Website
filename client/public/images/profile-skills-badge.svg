<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#bgGradient)" rx="20"/>
  
  <!-- Glass card effect -->
  <rect x="20" y="20" width="260" height="360" fill="url(#cardGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="15"/>
  
  <!-- Profile circle placeholder -->
  <circle cx="150" cy="80" r="30" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="150" y="87" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">MH</text>
  
  <!-- Name -->
  <text x="150" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Murtuza Husain</text>
  <text x="150" y="150" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12">Computer Science Graduate</text>
  
  <!-- Skills Section -->
  <text x="150" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Core Skills</text>
  
  <!-- Java Skill -->
  <rect x="40" y="200" width="220" height="35" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="8"/>
  <text x="50" y="220" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Java</text>
  <text x="250" y="220" text-anchor="end" fill="#4CAF50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">90%</text>
  <rect x="50" y="225" width="180" height="4" fill="rgba(255,255,255,0.2)" rx="2"/>
  <rect x="50" y="225" width="162" height="4" fill="#4CAF50" rx="2" filter="url(#glow)"/>
  
  <!-- C++ Skill -->
  <rect x="40" y="250" width="220" height="35" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="8"/>
  <text x="50" y="270" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">C++</text>
  <text x="250" y="270" text-anchor="end" fill="#2196F3" font-family="Arial, sans-serif" font-size="12" font-weight="bold">80%</text>
  <rect x="50" y="275" width="180" height="4" fill="rgba(255,255,255,0.2)" rx="2"/>
  <rect x="50" y="275" width="144" height="4" fill="#2196F3" rx="2" filter="url(#glow)"/>
  
  <!-- Python Skill -->
  <rect x="40" y="300" width="220" height="35" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="8"/>
  <text x="50" y="320" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Python</text>
  <text x="250" y="320" text-anchor="end" fill="#FF9800" font-family="Arial, sans-serif" font-size="12" font-weight="bold">85%</text>
  <rect x="50" y="325" width="180" height="4" fill="rgba(255,255,255,0.2)" rx="2"/>
  <rect x="50" y="325" width="153" height="4" fill="#FF9800" rx="2" filter="url(#glow)"/>
  
  <!-- Machine Learning Skill -->
  <rect x="40" y="350" width="220" height="35" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="8"/>
  <text x="50" y="370" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Machine Learning</text>
  <text x="250" y="370" text-anchor="end" fill="#E91E63" font-family="Arial, sans-serif" font-size="12" font-weight="bold">85%</text>
  <rect x="50" y="375" width="180" height="4" fill="rgba(255,255,255,0.2)" rx="2"/>
  <rect x="50" y="375" width="153" height="4" fill="#E91E63" rx="2" filter="url(#glow)"/>
</svg>